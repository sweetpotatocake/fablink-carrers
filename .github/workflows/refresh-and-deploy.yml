name: FABLINK daily refresh and publish

on:
  schedule:
    # Every day 08:17 Korea time (23:17 UTC on previous day)
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fablink-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover postings via public RSS (no API key)
        run: python update_jobs.py

      - name: Rebuild HTML
        run: python render.py

      - name: Save updated postings to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh job postings [skip ci]'
            git push
          fi

      - name: Prepare public website
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp data.json public/data.json
          touch public/.nojekyll
          test -s public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
